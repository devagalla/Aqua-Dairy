<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7ef">
    <title>Aqua Dairy · Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7ef; color: #36564b; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(90vw, 480px); padding: 32px; border: 1px solid #dce8dc; border-radius: 16px; background: #fff; box-shadow: 0 18px 60px #36564b12; }
      h1 { margin: 0 0 12px; font: 500 30px/1.2 Georgia, serif; }
      p { color: #728278; }
      button { border: 0; border-radius: 6px; padding: 12px 18px; background: #397765; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>YOUR FARM, IN FOCUS</p>
      <h1>You’re offline</h1>
      <p>Keep an already-open logging form on screen to save records on this device. They will sync automatically when your connection returns. Reconnect before reloading or signing in again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
